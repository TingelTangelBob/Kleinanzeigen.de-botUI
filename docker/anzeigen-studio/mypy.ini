;
; mypy-Konfiguration des Forks.
;
; Warum eine eigene: Die Konfiguration des Upstreams nimmt src/anzeigen_studio/
; von der Verzeichnissuche aus (siehe pyproject.toml). Das ist noetig, weil die
; Upstream-CI unsere Abhaengigkeiten nicht installiert und mypy sonst 27
; Scheinfehler meldet. Der Ausschluss wirkt aber auch, wenn man das Verzeichnis
; ausdruecklich uebergibt - also braucht unsere Pruefung eine eigene Datei.
;
; Angenehmer Nebeneffekt: Hier laesst sich tests_studio/ mitpruefen, das die
; Upstream-Konfiguration (files = scripts,src,tests) nie erfasst hat.
;
; Die Strenge entspricht der des Upstreams. Wer sie hier senkt, senkt sie nur
; fuer den Fork - und sollte das begruenden.

[mypy]
python_version = 3.12
files = src/anzeigen_studio, tests_studio
strict = True
disallow_untyped_calls = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
ignore_missing_imports = True
show_error_codes = True
warn_unused_ignores = True
cache_dir = .temp/cache_mypy_studio

; Tests duerfen ungenannte Rueckgabetypen der Bibliotheken durchreichen -
; pytest-Fixtures und Ersatzobjekte sonst staendig zu annotieren bringt hier
; keinen Erkenntnisgewinn.
[mypy-tests_studio.*]
disallow_untyped_decorators = False
