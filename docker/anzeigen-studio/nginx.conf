# Liefert die Oberfläche aus, reicht /api ans Backend weiter und schützt die
# eingebettete Browsersicht (AP-1.8) mit einer Sitzungsprüfung.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Die Einstiegsseite darf NICHT im Browser-Cache altern.
    #
    # Aufgefallen am 2026-08-30: Nach einer Auslieferung lief im Browser
    # weiter der alte Build. Der Server lieferte `index-jotWGByF.js`, geladen
    # war `index-CTOX9XQu.js`. Grund war, dass hier gar kein `Cache-Control`
    # stand - ohne den Kopf wenden Browser eine eigene Schaetzung an und
    # behalten `index.html` eine Weile. Da die Datei die Namen aller anderen
    # Dateien enthaelt, haelt eine alte Einstiegsseite die ganze alte
    # Anwendung fest. Eine Auslieferung, die den Nutzer nicht erreicht, ist
    # keine.
    #
    # `no-cache` heisst nicht "nicht speichern", sondern "vor Benutzung
    # rueckfragen". Mit ETag kostet das im Normalfall ein 304 und keine
    # Uebertragung.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Die uebrigen Dateien tragen einen Inhalts-Hash im Namen (Vite). Aendert
    # sich der Inhalt, aendert sich der Name - sie koennen deshalb beliebig
    # lange gehalten werden. `immutable` erspart selbst die Rueckfrage.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hash-Routing: alle Pfade auf die Einstiegsseite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Archiv-Upload (AP-3.6) --------------------------------------------
    #
    # Eigener Ort, weil die Grenze eine voellig andere ist: Ein Profilarchiv
    # mit Bildern wiegt schnell dreistellige Megabyte, ein Anzeigenbild nie.
    # Ohne diesen Block griffe die 16-MB-Grenze von /api/ darunter, und der
    # Import scheiterte an einer englischen HTML-Fehlerseite von nginx - noch
    # bevor das Backend eine deutsche Meldung erzeugen koennte.
    #
    # Muss vor `location /api/` stehen: nginx nimmt bei Praefixen den
    # laengsten Treffer, aber die Reihenfolge im Kopf zu haben hilft beim Lesen.
    #
    # Gehoert zu MAX_ARCHIV_BYTES in src/anzeigen_studio/bestand/archiv.py.
    # Wer dort etwas aendert, muss hier nachziehen.
    location /api/archiv/ {
        proxy_pass http://backend:8000;

        client_max_body_size 512m;
        # Ein grosses Archiv braucht laenger als die Vorgabe von 60 s - sowohl
        # beim Hochladen als auch beim Auswerten.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        # Bildupload (AP-2.6). Ohne diese Zeile gilt nginx' Standard von 1 MB,
        # und jedes Handyfoto scheitert an einer HTML-Fehlerseite von nginx,
        # bevor das Backend es überhaupt sieht - während die Anwendung selbst
        # 15 MB zusagt. Der Wert liegt bewusst knapp darüber, weil der
        # Multipart-Rumpf noch Grenzmarken und Kopfzeilen mitbringt.
        #
        # Gehört zu MAX_BYTES in src/anzeigen_studio/bestand/bilder.py. Wer
        # dort etwas ändert, muss hier nachziehen.
        client_max_body_size 16m;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job-Logs laufen über Server-Sent-Events (AP-1.7): keine Pufferung,
        # sonst kommt die Ausgabe erst am Ende des Laufs an.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- Browsersicht (AP-1.8) ---------------------------------------------
    #
    # Interner Prüfpfad. Nicht von außen erreichbar; nginx fragt ihn selbst ab,
    # bevor es die Browsersicht durchlässt.
    location = /_sitzung_pruefen {
        internal;
        proxy_pass http://backend:8000/api/auth/pruefen;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /browsersicht/ {
        # Ohne gültige Sitzung kein Zugang. Der Browser im Container zeigt eine
        # angemeldete Kleinanzeigen-Sitzung und lässt sich fernsteuern - das
        # ist der schützenswerteste Pfad der ganzen Anwendung.
        auth_request /_sitzung_pruefen;

        proxy_pass http://backend:6080/;
        proxy_http_version 1.1;

        # noVNC läuft über WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # Eine Captcha-Eingabe kann dauern; ohne lange Fristen bricht die
        # Verbindung mitten in der Übernahme ab.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
