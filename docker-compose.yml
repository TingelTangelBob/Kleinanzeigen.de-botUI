#
# Anzeigen-Studio - Entwicklungs- und Teststand. Neue Datei, nicht im Upstream.
#
# Stand AP-0.6: Geruest. Der Browser-Dienst fehlt noch bewusst - er kommt mit
# AP-1.1 (Chromium unter Xvfb, persistentes Profil) und AP-1.8 (noVNC), weil er
# ohne den Bot-Adapter nichts zu tun haette.
#
# Produktivstand ist AP-7.1 und wird davon getrennt gehalten.

name: anzeigen-studio

services:
  backend:
    build:
      context: .
      dockerfile: docker/anzeigen-studio/backend.Dockerfile
    restart: unless-stopped
    # Chromium hinterlässt beim Beenden verwaiste Kindprozesse. Ohne einen
    # init-Prozess als PID 1 werden sie nie eingesammelt und häufen sich als
    # Zombies an - über viele Läufe bis zum Erreichen der Prozessgrenze.
    init: true
    environment:
      # Ohne Schluessel startet das Backend, meldet den Mangel aber und
      # verweigert spaeter das Speichern von Zugangsdaten (AP-1.4).
      ANZEIGEN_STUDIO_SECRET_KEY: ${ANZEIGEN_STUDIO_SECRET_KEY:-}
      ANZEIGEN_STUDIO_DATA_DIR: /data
      ANZEIGEN_STUDIO_DEV: ${ANZEIGEN_STUDIO_DEV:-false}
      TZ: Europe/Berlin
      # Der Bot waehlt seine Sprache aus LANG (utils/i18n.py). Ohne diese Zeile
      # steht dort C.UTF-8, und das gesamte Protokoll erscheint auf Englisch -
      # entgegen der Regel, dass alle sichtbaren Texte Deutsch sind.
      #
      # Das Image hat keine erzeugten Locale-Daten, und es braucht auch keine:
      # Gelesen wird nur die Zeichenkette, `setlocale` ruft niemand auf.
      LANG: de_DE.UTF-8
    volumes:
      - studio-data:/data
    # Chromium stuerzt bei knappem /dev/shm reproduzierbar ab. Die Vorgabe von
    # 64 MB reicht nicht, sobald Bilder hochgeladen werden.
    shm_size: 512m
    # Kein Port nach aussen: der Zugang laeuft ausschliesslich ueber webui.
    # Das Backend haelt fremde Zugangsdaten und gehoert nicht ins Netz.
    expose:
      - "8000"
      # Browsersicht (AP-1.8). Nur im Docker-Netz, nicht auf dem Wirt - der
      # Zugang läuft über nginx und nur mit gültiger Sitzung.
      - "6080"

  webui:
    build:
      context: .
      dockerfile: docker/anzeigen-studio/webui.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Nur an localhost gebunden. Wer die Oberflaeche im Netz erreichbar
      # machen will, stellt bewusst einen Reverse Proxy davor - siehe
      # Entscheidung 7 im Projektplan.
      - "127.0.0.1:8080:80"
    environment:
      TZ: Europe/Berlin

volumes:
  studio-data:
