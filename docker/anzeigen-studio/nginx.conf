# Liefert die Oberflaeche aus und reicht /api ans Backend weiter, damit beide
# unter demselben Ursprung liegen.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-Routing: alle Pfade auf die Einstiegsseite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job-Logs laufen ueber Server-Sent-Events (AP-1.7): keine Pufferung,
        # sonst kommt die Ausgabe erst am Ende des Laufs an.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
